name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # O runner do GitHub já vem com o Android SDK (ANDROID_HOME).
      - name: Compilar
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -25 build.log | while IFS= read -r l; do echo "::warning::$l"; done

      - name: Renomear APKs
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/CasaHub-debug.apk
          cp app/build/outputs/apk/release/app-release.apk saida/CasaHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CasaHub-apk
          path: saida/*.apk

      # Testa o APK num emulador e tira capturas de cada tela.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas no emulador
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/screens.sh

      - name: Resultado das capturas
        if: always()
        run: |
          cat shots/status.txt 2>/dev/null | while IFS= read -r l; do echo "::notice::$l"; done
          grep -q CRASH shots/status.txt 2>/dev/null && head -30 shots/crash.txt | while IFS= read -r l; do echo "::error::$l"; done || true

      # Publica o APK numa página de Release, com link fixo para baixar no celular.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="saida/CasaHub.apk saida/CasaHub-debug.apk"
          ls shots/* >/dev/null 2>&1 && FILES="$FILES $(ls shots/*)"
          gh release create "$TAG" $FILES \
            --title "CasaHub ${{ github.run_number }}" \
            --notes "APK gerado automaticamente. Baixe CasaHub.apk no celular e instale." \
            --latest
