name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Renomear APKs
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/CasaHub-debug.apk
          cp app/build/outputs/apk/release/app-release.apk saida/CasaHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CasaHub-apk
          path: saida/*.apk
